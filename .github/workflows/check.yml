name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Portable validation
        run: |
          if python3 -c 'import json; raise SystemExit(json.load(open(".template.json"))["initialized"])'; then
            ./tools/check --template --portable
          else
            ./tools/check --portable
          fi
      - name: Behavioral tests
        run: ./tests/run
